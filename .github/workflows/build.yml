name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Only buf is needed here: make testdata installs the protoc-gen-go it
      # pins from go.mod into .tools itself, so PATH cannot leak a different
      # version into the golden files.
      - name: Install Buf
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/bufbuild/buf/cmd/buf@v1.73.0
      - name: Check dependencies
        run: make tidy-check
      # The plugin binary is the deliverable: compile it before testing.
      - name: Build
        run: make build
      - name: Test
        run: make test
      # Rebuilding the fixtures must not change anything that is committed
      # (descriptor sets and golden files).
      - name: Verify generated files
        run: git diff --exit-code
