syntax = "proto3";

package testdata.oneof.v1;

import "sphere/binding/binding.proto";

option go_package = "github.com/go-sphere/protoc-gen-sphere-binding/generate/binding/testdata/gen/oneofv1;oneofv1";

// OneofRequest exercises oneof level defaults plus nested messages, both of
// which inherit the location/auto_tags from their enclosing scope.
message OneofRequest {
  option (sphere.binding.default_location) = BINDING_LOCATION_QUERY;

  string outer = 1;

  // NOTE: protoc-gen-go emits each oneof member in its own wrapper struct
  // (OneofRequest_ByName), so the plugin keys the tags by that wrapper struct
  // name. The golden file shows the uri/validate tags landing on the wrapper
  // fields (OneofRequest_ByName.ByName, OneofRequest_ById.ById).
  oneof selector {
    option (sphere.binding.default_oneof_location) = BINDING_LOCATION_URI;
    option (sphere.binding.default_oneof_auto_tags) = "validate";

    string by_name = 2;
    int64 by_id = 3;
  }

  // Nested message: its own scalar fields inherit the enclosing message
  // location (QUERY) when it is instantiated in a QUERY scope.
  message Filter {
    string status = 1;
    int64 limit = 2;
  }

  // A message-typed field cannot be bound from a single query token, so it is
  // pinned to JSON explicitly. Without this override it would inherit the
  // message default (QUERY) and the plugin would reject it (message fields are
  // not scalar-bindable to query/uri/header).
  Filter filter = 4 [(sphere.binding.location) = BINDING_LOCATION_JSON];
}

message OneofResponse {
  string ok = 1;
}
